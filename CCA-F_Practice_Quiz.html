<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCA-F Practice Question Bank</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f8f9fa;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-secondary: #6b7280;
    --accent: #2563eb;
    --success-bg: #d1fae5;
    --success-text: #065f46;
    --error-bg: #fee2e2;
    --error-text: #991b1b;
    --neutral-bg: #f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --surface: #1f2937;
      --border: #374151;
      --text: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent: #60a5fa;
      --success-bg: #064e3b;
      --success-text: #a7f3d0;
      --error-bg: #7f1d1d;
      --error-text: #fecaca;
      --neutral-bg: #374151;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 2rem 1rem;
    line-height: 1.6;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
  }
  header {
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    margin: 0 0 0.5rem 0;
    font-size: 1.75rem;
  }
  .subtitle {
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin: 0;
  }
  .controls {
    display: flex;
    gap: 1rem;
    align-items: center;
    flex-wrap: wrap;
    padding: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    margin-bottom: 1.5rem;
    position: sticky;
    top: 1rem;
    z-index: 10;
  }
  .controls label {
    font-size: 0.9rem;
    color: var(--text-secondary);
  }
  select, button {
    padding: 0.4rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 0.375rem;
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover {
    background: var(--neutral-bg);
  }
  button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  button.primary:hover {
    opacity: 0.9;
  }
  .score {
    margin-left: auto;
    font-weight: 500;
    font-size: 0.95rem;
  }
  h2.section-heading {
    font-size: 1.15rem;
    margin: 2rem 0 1rem 0;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
    color: var(--accent);
  }
  .question {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .question-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }
  .question-number {
    font-size: 0.8rem;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .question-text {
    margin: 0 0 1rem 0;
    font-size: 0.95rem;
  }
  .question-text code {
    background: var(--neutral-bg);
    padding: 0.1rem 0.35rem;
    border-radius: 0.25rem;
    font-size: 0.85em;
    font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
  }
  .question-text pre {
    background: var(--neutral-bg);
    padding: 0.75rem;
    border-radius: 0.375rem;
    overflow-x: auto;
    margin: 0.5rem 0;
    font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
    font-size: 0.8rem;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    margin-bottom: 1rem;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 0.375rem;
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1.5;
    background: var(--bg);
  }
  .option:hover {
    background: var(--neutral-bg);
  }
  .option input[type="radio"] {
    margin-top: 0.15rem;
    flex-shrink: 0;
    cursor: pointer;
  }
  .option.correct {
    background: var(--success-bg);
    color: var(--success-text);
    border-color: var(--success-text);
  }
  .option.picked-wrong {
    background: var(--error-bg);
    color: var(--error-text);
    border-color: var(--error-text);
  }
  .check-btn {
    padding: 0.4rem 0.85rem;
    font-size: 0.85rem;
  }
  .explanation {
    margin-top: 0.75rem;
    padding: 0.75rem;
    background: var(--bg);
    border-left: 3px solid var(--accent);
    border-radius: 0.25rem;
    font-size: 0.85rem;
    color: var(--text-secondary);
    display: none;
  }
  .explanation.shown {
    display: block;
  }
  .explanation strong {
    color: var(--text);
  }
  .hidden {
    display: none;
  }
  .footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 0.85rem;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>CCA-F Practice Question Bank</h1>
  <p class="subtitle">Interactive study tool — answer, check, learn from mistakes.</p>
</header>

<div class="controls">
  <label>
    Section:
    <select id="section-filter">
      <option value="all">All sections</option>
      <option value="1">1. API Basics</option>
      <option value="2">2. Prompt Engineering</option>
      <option value="3">3. Response Handling</option>
      <option value="4">4. Context Management</option>
      <option value="5">5. Tool Use — Loop</option>
      <option value="6">6. Tool Use — Errors</option>
      <option value="7">7. MCP — Concepts</option>
      <option value="8">8. MCP — Building</option>
      <option value="9">9. Extra</option>
    </select>
  </label>
  <button id="check-all" class="primary">Check all answered</button>
  <button id="reset">Reset</button>
  <span class="score" id="score">0 answered · 0 correct</span>
</div>

<div id="questions-container"></div>

<div class="footer">
  Question bank compiled from PJ's CCA-F coaching sessions · Last updated end of week 5 material.
</div>

<script>
const questions = [
  // ============ Section 1: API Basics ============
  {
    section: 1, sectionName: "API Basics", num: 1,
    text: `A developer's API call fails with error: "messages.1: role must be 'user' or 'assistant'". Their code:<pre>messages = [
    {"role": "user", "content": "Hello"},
    {"role": "system", "content": "Be brief"},
    {"role": "user", "content": "Explain photosynthesis"}
]</pre>What's the fix?`,
    options: {
      a: "Reorder so user and assistant strictly alternate",
      b: "Remove the system message from <code>messages</code> and pass it via the <code>system=</code> parameter on <code>client.messages.create()</code>",
      c: "Change <code>\"system\"</code> to lowercase throughout",
      d: "Add an assistant message before the system one"
    },
    correct: "b",
    explanation: "System is a parameter, not a role. Only <code>user</code> and <code>assistant</code> are valid role values in the messages array."
  },
  {
    section: 1, sectionName: "API Basics", num: 2,
    text: `You're building a customer support bot. It should always speak formally, refuse off-topic queries, and escalate refund requests. Robust design says:`,
    options: {
      a: "Include these rules in every user message",
      b: "Set them once via <code>system=</code> parameter on <code>client.messages.create()</code>",
      c: "Prepend as an <code>{\"role\": \"system\", ...}</code> in the messages list",
      d: "Set them via <code>assistant=</code> parameter"
    },
    correct: "b",
    explanation: "<code>system=</code> parameter persists for the conversation and is more resistant to override attempts than putting rules in user messages."
  },
  {
    section: 1, sectionName: "API Basics", num: 3,
    text: `An engineer wants all interactions with an internal legal-triage bot to (a) speak formally, (b) refuse anything outside legal topics, and (c) survive attempted jailbreaks in later user messages. Where should these instructions be placed?`,
    options: {
      a: "In the first <code>user</code> message so the user can see the constraints",
      b: "In the <code>system</code> parameter, because it persists for the conversation and is harder to override",
      c: "Repeated as a preamble in every <code>user</code> message",
      d: "In an initial <code>assistant</code> message so Claude sees them as its own"
    },
    correct: "b",
    explanation: "Same as Q2 — system parameter is architecturally distinct and weighted differently by the model. More jailbreak-resistant."
  },
  {
    section: 1, sectionName: "API Basics", num: 4,
    text: `A developer's code uses these roles: <code>"user"</code>, <code>"agent"</code>, and <code>"system"</code>. The API returns a 400 error. Which change fixes it?`,
    options: {
      a: "Rename <code>\"system\"</code> to <code>\"instructions\"</code> and keep <code>\"agent\"</code>",
      b: "Rename <code>\"agent\"</code> to <code>\"assistant\"</code> and move <code>\"system\"</code> content into the separate <code>system</code> parameter",
      c: "Rename <code>\"user\"</code> to <code>\"human\"</code> and <code>\"agent\"</code> to <code>\"bot\"</code>",
      d: "Add a <code>\"tool\"</code> role between <code>\"user\"</code> and <code>\"agent\"</code>"
    },
    correct: "b",
    explanation: "Two fixes needed: <code>\"agent\"</code> isn't valid (should be <code>\"assistant\"</code>); <code>\"system\"</code> isn't a role (goes in the separate parameter)."
  },
  {
    section: 1, sectionName: "API Basics", num: 5,
    text: `A developer adds a system prompt by doing this:<pre>messages.append({"role": "system", "content": "You are a legal assistant."})</pre>Then calls <code>client.messages.create(model=..., messages=messages)</code>. What happens?`,
    options: {
      a: "The API accepts it and Claude follows the persona",
      b: "The API accepts it but Claude ignores the system message",
      c: "The API returns an error because <code>system</code> is not a valid role",
      d: "The system prompt works but is much weaker than using the <code>system=</code> parameter"
    },
    correct: "c",
    explanation: "API rejects with 400 error. Only <code>user</code> and <code>assistant</code> roles exist."
  },

  // ============ Section 2: Prompt Engineering ============
  {
    section: 2, sectionName: "Prompt Engineering", num: 6,
    text: `You are designing a nightly batch job that summarises 20,000 documents. Each summary is stored to a database for later retrieval. Should you use streaming for the API calls?`,
    options: {
      a: "Yes — streaming reduces total token cost for large batches",
      b: "Yes — streaming avoids hitting rate limits",
      c: "Yes — streaming produces higher-quality responses in batch settings",
      d: "No — streaming has no benefit when no human is watching in real time"
    },
    correct: "d",
    explanation: "Streaming's only benefit is perceived latency for a human. No human = no benefit. Same total time, tokens, cost."
  },
  {
    section: 2, sectionName: "Prompt Engineering", num: 7,
    text: `Claude sometimes returns JSON wrapped in markdown fences (<code>\`\`\`json</code>), breaking your parser. You've already added "return only valid JSON" to the system prompt but the issue persists intermittently. What's the most reliable additional technique?`,
    options: {
      a: "Retry the request until valid JSON is returned",
      b: "Set <code>temperature</code> to 0",
      c: "Prefill the assistant message with <code>\"{\"</code> to force JSON continuation",
      d: "Switch to structured output mode with a JSON schema in system"
    },
    correct: "c",
    explanation: "Prefilling with <code>{</code> forces Claude's response to continue from that character. Cannot add \"Here's the JSON:\" preamble because the response literally starts with <code>{</code>."
  },

  // ============ Section 3: Response Handling ============
  {
    section: 3, sectionName: "Response Handling", num: 8,
    text: `A developer's agent code has:<pre>if response.stop_reason == "tool_result":
    handle_tool(response.content[0])</pre>Why is it broken?`,
    options: {
      a: "<code>stop_reason</code> attribute doesn't exist on response objects",
      b: "<code>\"tool_result\"</code> is not a valid <code>stop_reason</code> — the correct value when Claude wants a tool is <code>\"tool_use\"</code>",
      c: "<code>response.content[0]</code> should be <code>response.content.first</code>",
      d: "The comparison needs <code>.value</code> on <code>stop_reason</code>"
    },
    correct: "b",
    explanation: "<code>\"tool_result\"</code> is never a valid <code>stop_reason</code>. Real value is <code>\"tool_use\"</code> when Claude wants a tool. Without this fix, the if-block never runs."
  },
  {
    section: 3, sectionName: "Response Handling", num: 9,
    text: `A tool-enabled call returns <code>response.content</code> as:<pre>[TextBlock(text="Let me check..."),
 ToolUseBlock(name="get_weather", input={...}, id="abc")]</pre>Your code does <code>tool_block = response.content[0]</code>. What happens?`,
    options: {
      a: "It correctly grabs the ToolUseBlock",
      b: "It grabs the TextBlock, then crashes when you try to access <code>.name</code> or <code>.input</code>",
      c: "The API rejects the response for having two content blocks",
      d: "Content blocks are automatically re-ordered so <code>tool_use</code> is first"
    },
    correct: "b",
    explanation: "<code>response.content</code> is a list. Position 0 is whatever happens to be first — often a TextBlock, not the ToolUseBlock. Filter by <code>.type</code> instead."
  },

  // ============ Section 4: Context Management ============
  {
    section: 4, sectionName: "Context Management", num: 10,
    text: `A user chats with a Claude-powered bot for 20 turns. The developer restarts the Python process. On turn 21, the user asks: "What was that number I asked you to remember?" What happens?`,
    options: {
      a: "Claude retrieves it from server-side session state",
      b: "Claude has no memory — the <code>messages</code> list was in-memory and is now empty",
      c: "Anthropic caches conversation history for 24 hours by API key",
      d: "Claude asks the user to log in to restore session"
    },
    correct: "b",
    explanation: "API is stateless. Restart = fresh <code>messages</code> list = no memory."
  },
  {
    section: 4, sectionName: "Context Management", num: 11,
    text: `A user has been chatting with a Claude-powered bot for 20 turns. The developer decides to restart the Python process. On turn 21, the user asks: "What did I say earlier about my project deadline?" What happens?`,
    options: {
      a: "Claude retrieves the earlier context from Anthropic's server-side session cache",
      b: "Claude admits it has no record of the earlier conversation",
      c: "Claude asks the user to log back in",
      d: "The API returns an error because the session token is stale"
    },
    correct: "b",
    explanation: "Same as Q10 — no server-side session cache, no \"log in to restore.\""
  },
  {
    section: 4, sectionName: "Context Management", num: 12,
    text: `Which statement about conversation memory in the Anthropic API is accurate?`,
    options: {
      a: "Anthropic maintains conversation state per API key for 30 minutes",
      b: "The API is stateless; the developer must send the full transcript with every request",
      c: "Only the last 10 exchanges are cached server-side for continuity",
      d: "The <code>assistant</code> role stores state; the <code>user</code> role does not"
    },
    correct: "b",
    explanation: "Stateless API. Full transcript must be re-sent every call."
  },
  {
    section: 4, sectionName: "Context Management", num: 13,
    text: `Agent A completes tasks in 5 turns on average. Agent B does the same tasks but takes 30 turns (more careful reasoning). Same model, same tools, same per-turn message lengths. Approximate cost ratio B/A per session?`,
    options: {
      a: "~6x (turns proportional to cost)",
      b: "~30x or more (input tokens accumulate — earlier turns re-sent in later ones)",
      c: "Same cost (Anthropic caches conversation history)",
      d: "~2-3x (efficiency gains scale sublinearly)"
    },
    correct: "b",
    explanation: "Roughly quadratic scaling. 5 turns = sum of 1+2+3+4+5 = 15 turn-worths of input. 30 turns = 30*31/2 = 465. Ratio ≈ 31x, not 6x."
  },
  {
    section: 4, sectionName: "Context Management", num: 14,
    text: `A support chatbot's cost per conversation is £0.30 at 15 turns. Assuming user and assistant message lengths remain similar throughout, what would you roughly expect a 30-turn session to cost?`,
    options: {
      a: "£0.30 — cost is flat because conversation content is cached",
      b: "About £0.60 — twice as many turns, twice the cost",
      c: "Significantly more than £0.60 — later turns send more history than earlier turns",
      d: "About £0.45 — the model is more efficient with longer context"
    },
    correct: "c",
    explanation: "Same principle as Q13 — not linear because later turns send more history."
  },
  {
    section: 4, sectionName: "Context Management", num: 15,
    text: `A developer's chatbot works fine in isolated tests but "forgets things" in longer conversations. Their code:<pre>messages = []
while True:
    user_input = input()
    messages.append({"role": "user", "content": user_input})
    response = client.messages.create(...)
    print(response.content[0].text)</pre>What's the bug?`,
    options: {
      a: "Missing a system prompt",
      b: "Claude's response is never appended to <code>messages</code> — Claude only sees user turns in history",
      c: "The loop should use streaming",
      d: "<code>max_tokens</code> is undefined"
    },
    correct: "b",
    explanation: "Missing assistant append. Claude sees only user side of conversation on each new call."
  },
  {
    section: 4, sectionName: "Context Management", num: 16,
    text: `A developer wants Claude to have full conversation memory. Which of these code patterns achieves that?<br><br><strong>Pattern A:</strong><pre>messages.append({"role": "user", "content": user_input})
response = client.messages.create(messages=messages)
# nothing else</pre><strong>Pattern B:</strong><pre>messages.append({"role": "user", "content": user_input})
response = client.messages.create(messages=messages)
messages.append({"role": "assistant", "content": response.content[0].text})</pre><strong>Pattern C:</strong><pre>response = client.messages.create(messages=[{"role": "user", "content": user_input}])</pre>`,
    options: {
      a: "Pattern A",
      b: "Pattern B",
      c: "Pattern C",
      d: "All three achieve full memory"
    },
    correct: "b",
    explanation: "Pattern B correctly appends both user AND assistant to <code>messages</code>."
  },
  {
    section: 4, sectionName: "Context Management", num: 17,
    text: `If Claude correctly appends both user and assistant messages every turn, how many entries are in the <code>messages</code> list at the end of a 10-turn conversation?`,
    options: {
      a: "10",
      b: "20",
      c: "11 (10 user + 1 assistant summary)",
      d: "Depends on the <code>max_tokens</code> setting"
    },
    correct: "b",
    explanation: "10 user + 10 assistant = 20 entries."
  },
  {
    section: 4, sectionName: "Context Management", num: 18,
    text: `You accidentally delete the line that appends the assistant reply back to <code>messages</code>. The script still runs without errors. What behaviour changes?`,
    options: {
      a: "Nothing — Claude tracks its own responses server-side",
      b: "Claude will loop indefinitely because it never sees a stop signal",
      c: "Claude will respond as if every turn were the first — no memory of prior replies, but still responds to each user message",
      d: "The next API call will crash with a role-alternation error"
    },
    correct: "c",
    explanation: "Claude has no memory of its own prior responses, so each turn feels like the first. But it doesn't crash — the API accepts user-only history."
  },

  // ============ Section 5: Tool Use — Loop ============
  {
    section: 5, sectionName: "Tool Use — Loop", num: 19,
    text: `You've built a tool-enabled agent. A user asks a question Claude can answer using an available tool. Why does the interaction require two API calls rather than one?`,
    options: {
      a: "The first call authenticates the tool; the second executes it",
      b: "Claude checks its answer twice for accuracy",
      c: "The first returns Claude's request to use a tool; after your code runs the tool, the second sends the result back for Claude to compose the final answer",
      d: "The first is a dry-run to estimate cost; the second is the real call"
    },
    correct: "c",
    explanation: "Claude cannot execute code. First call = tool request. Your code runs the tool. Second call = result back to Claude for the final natural-language answer."
  },
  {
    section: 5, sectionName: "Tool Use — Loop", num: 20,
    text: `Claude decides to use a tool. What does the response contain?`,
    options: {
      a: "The executed result of the tool",
      b: "A <code>tool_use</code> block describing which tool to call and with what inputs, along with a unique ID",
      c: "A text answer that includes the tool name in brackets",
      d: "A stop_reason of <code>tool_result</code>"
    },
    correct: "b",
    explanation: "Response contains a <code>tool_use</code> block with <code>name</code>, <code>input</code>, and <code>id</code>. Claude never runs the tool — it requests one."
  },
  {
    section: 5, sectionName: "Tool Use — Loop", num: 21,
    text: `You've defined a <code>get_stock_price</code> tool. A user asks: "What's Apple's stock price?" You inspect <code>response.content</code> from the first API call. Which best describes what's inside?`,
    options: {
      a: "A string: <code>\"[TOOL: get_stock_price(ticker='AAPL')]\"</code>",
      b: "A list containing a <code>ToolUseBlock</code> object with <code>name='get_stock_price'</code>, <code>input={'ticker': 'AAPL'}</code>, and a unique <code>id</code>",
      c: "A string with Apple's stock price already looked up by Claude",
      d: "An empty list — the tool was executed silently"
    },
    correct: "b",
    explanation: "Same as Q20 — <code>ToolUseBlock</code> with name, input dict, and id."
  },
  {
    section: 5, sectionName: "Tool Use — Loop", num: 22,
    text: `Your Python code has run a tool and now needs to send the result back to Claude. What is the correct <code>role</code> for the message containing the <code>tool_result</code> block?`,
    options: {
      a: "<code>assistant</code>",
      b: "<code>tool</code>",
      c: "<code>user</code>",
      d: "<code>system</code>"
    },
    correct: "c",
    explanation: "Role is <code>user</code>. Roles are <code>user</code> and <code>assistant</code> only; anything sent TO Claude is <code>user</code>, regardless of content type."
  },
  {
    section: 5, sectionName: "Tool Use — Loop", num: 23,
    text: `Claude's response contains three <code>tool_use</code> blocks (parallel tool calls). How should you structure the response back to the API?`,
    options: {
      a: "Three separate messages, each with one <code>tool_result</code> and its matching id",
      b: "One <code>user</code> message whose content is a list of three <code>tool_result</code> blocks with matching ids",
      c: "One <code>assistant</code> message containing all three results concatenated as text",
      d: "Send only the first result; Claude will re-request the others"
    },
    correct: "b",
    explanation: "All tool_results in one user message, as a list of blocks, each with its matching <code>tool_use_id</code>."
  },
  {
    section: 5, sectionName: "Tool Use — Loop", num: 24,
    text: `Claude's response contains two tool_use blocks with IDs <code>"toolu_abc"</code> and <code>"toolu_xyz"</code>. What's true about your response back to the API?`,
    options: {
      a: "Send one <code>tool_result</code> message, then wait for Claude to ask for the next",
      b: "Send both <code>tool_result</code> blocks in a single <code>user</code> message, each with matching <code>tool_use_id</code>",
      c: "<code>tool_use_id</code> is optional when there's only one recent tool call",
      d: "Order and IDs don't matter — the API pairs them automatically"
    },
    correct: "b",
    explanation: "Same as Q23 — one message, list of results, IDs matter."
  },

// ============ RENDERING ============

const container = document.getElementById('questions-container');
const sectionFilter = document.getElementById('section-filter');
const scoreEl = document.getElementById('score');
const checkAllBtn = document.getElementById('check-all');
const resetBtn = document.getElementById('reset');

function render(filterSection = 'all') {
  container.innerHTML = '';
  
  // Group by section
  const sections = {};
  questions.forEach(q => {
    if (filterSection !== 'all' && String(q.section) !== filterSection) return;
    if (!sections[q.section]) sections[q.section] = { name: q.sectionName, qs: [] };
    sections[q.section].qs.push(q);
  });
  
  Object.entries(sections).forEach(([sectionId, { name, qs }]) => {
    const heading = document.createElement('h2');
    heading.className = 'section-heading';
    heading.textContent = `Section ${sectionId}: ${name}`;
    container.appendChild(heading);
    
    qs.forEach(q => {
      const qDiv = document.createElement('div');
      qDiv.className = 'question';
      qDiv.dataset.qnum = q.num;
      qDiv.dataset.correct = q.correct;
      
      const header = document.createElement('div');
      header.className = 'question-header';
      header.innerHTML = `<span class="question-number">Question ${q.num}</span>`;
      qDiv.appendChild(header);
      
      const textDiv = document.createElement('div');
      textDiv.className = 'question-text';
      textDiv.innerHTML = q.text;
      qDiv.appendChild(textDiv);
      
      const optionsDiv = document.createElement('div');
      optionsDiv.className = 'options';
      Object.entries(q.options).forEach(([key, val]) => {
        const label = document.createElement('label');
        label.className = 'option';
        label.dataset.optKey = key;
        label.innerHTML = `<input type="radio" name="q${q.num}" value="${key}"> <span><strong>${key})</strong> ${val}</span>`;
        optionsDiv.appendChild(label);
      });
      qDiv.appendChild(optionsDiv);
      
      const checkBtn = document.createElement('button');
      checkBtn.className = 'check-btn';
      checkBtn.textContent = 'Check';
      checkBtn.onclick = () => checkQuestion(qDiv, q);
      qDiv.appendChild(checkBtn);
      
      const expl = document.createElement('div');
      expl.className = 'explanation';
      expl.innerHTML = `<strong>Answer: ${q.correct.toUpperCase()}</strong> — ${q.explanation}`;
      qDiv.appendChild(expl);
      
      container.appendChild(qDiv);
    });
  });
  
  updateScore();
}

function checkQuestion(qDiv, q) {
  const picked = qDiv.querySelector('input[type="radio"]:checked');
  qDiv.querySelectorAll('.option').forEach(opt => {
    opt.classList.remove('correct', 'picked-wrong');
    const key = opt.dataset.optKey;
    if (key === q.correct) opt.classList.add('correct');
    if (picked && picked.value === key && key !== q.correct) opt.classList.add('picked-wrong');
  });
  qDiv.querySelector('.explanation').classList.add('shown');
  qDiv.dataset.checked = 'true';
  qDiv.dataset.pickedCorrect = picked && picked.value === q.correct ? 'true' : 'false';
  updateScore();
}

function checkAll() {
  document.querySelectorAll('.question').forEach(qDiv => {
    if (qDiv.querySelector('input[type="radio"]:checked')) {
      const q = questions.find(x => String(x.num) === qDiv.dataset.qnum);
      if (q) checkQuestion(qDiv, q);
    }
  });
}

function updateScore() {
  const allQs = document.querySelectorAll('.question');
  const answered = document.querySelectorAll('.question input[type="radio"]:checked').length;
  const checked = document.querySelectorAll('.question[data-checked="true"]').length;
  const correct = document.querySelectorAll('.question[data-picked-correct="true"]').length;
  if (checked > 0) {
    scoreEl.textContent = `${answered} answered · ${correct} / ${checked} checked correct`;
  } else {
    scoreEl.textContent = `${answered} answered · 0 checked`;
  }
}

function reset() {
  document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
  document.querySelectorAll('.question').forEach(q => {
    delete q.dataset.checked;
    delete q.dataset.pickedCorrect;
  });
  document.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'picked-wrong'));
  document.querySelectorAll('.explanation').forEach(e => e.classList.remove('shown'));
  updateScore();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

sectionFilter.addEventListener('change', e => render(e.target.value));
checkAllBtn.addEventListener('click', checkAll);
resetBtn.addEventListener('click', reset);
container.addEventListener('change', e => {
  if (e.target.type === 'radio') updateScore();
});

render('all');
</script>
